name: Release TypeScript SDK to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'ts-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or version to publish'
        required: false
        default: 'latest'

jobs:
  publish:
    name: Build, Test & Publish @piaa/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write # For GitHub Release
      id-token: write # For npm provenance signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm registry authentication
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run SDK Unit Tests
        run: |
          cd typescript
          bun test

      - name: Build SDK bundle & TypeScript declarations
        run: |
          cd typescript
          bun run build

      - name: Publish to npm (with adaptive provenance)
        run: |
          cd typescript
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Repository is private: publishing without provenance..."
            npm publish --access public
          else
            echo "Repository is public: publishing with provenance..."
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "TypeScript SDK ${{ github.ref_name }}"
          generate_release_notes: true
          files: typescript/dist/*
